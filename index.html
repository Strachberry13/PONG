<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong</title>
<style>
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, sans-serif; overflow:hidden; background:#0b0f1a; color:#e6edf7; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:8px; padding:10px; box-sizing:border-box; }
  #scoreRow { display:flex; align-items:center; gap:18px; }
  #score { font-size:2.2rem; font-variant-numeric: tabular-nums; letter-spacing:.2em; }
  .pname { font-size:1.1rem; font-weight:600; min-width:110px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #nL { text-align:right; }
  #nR { text-align:left; }
  #stats { font-size:.85rem; opacity:.7; min-height:1.2em; font-variant-numeric: tabular-nums; }
  canvas { border:2px solid #24314d; border-radius:10px; width:min(100%,800px); max-height:65vh; aspect-ratio:800/500; touch-action:none; cursor:none; }
  #msg { font-size:.95rem; opacity:.85; min-height:1.3em; text-align:center; }
  button { background:#2b6cff; color:#fff; border:0; border-radius:8px; padding:8px 16px; font-size:1rem; cursor:pointer; }
  button.ghost { background:#1a2540; color:#c9d6ef; border:1px solid #24314d; }
  .overlay { position:fixed; inset:0; background:rgba(5,8,16,.9); display:flex; padding:16px; box-sizing:border-box; overflow:auto; }
  .overlay.hidden { display:none; }
  .card { background:#101829; border:1px solid #24314d; border-radius:14px; padding:22px 26px; width:min(440px,100%); display:flex; flex-direction:column; gap:16px; box-sizing:border-box; margin:auto; color:#e6edf7; }
  .card h1 { margin:0; text-align:center; font-size:2rem; letter-spacing:.15em; }
  .label { font-size:.85rem; text-transform:uppercase; letter-spacing:.1em; opacity:.7; margin-bottom:6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .opt { flex:1; background:#1a2540; color:#c9d6ef; border:1px solid #24314d; }
  .opt.on { background:#2b6cff; color:#fff; border-color:#2b6cff; }
  .primary { font-size:1.1rem; padding:12px; }
  .hint { font-size:.8rem; opacity:.7; text-align:center; line-height:1.5; min-height:1.2em; }
  .txt { padding:8px; border-radius:8px; border:1px solid #24314d; background:#0b0f1a; color:#fff; font-size:1rem; min-width:0; box-sizing:border-box; flex:1; }
  #codeIn { text-transform:uppercase; letter-spacing:.2em; }
  #bar { display:flex; gap:8px; }
  details summary { cursor:pointer; opacity:.85; }
  .custom { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  .custom label { display:flex; align-items:center; gap:8px; font-size:.9rem; }
  input[type=color] { width:44px; height:32px; border:0; background:none; padding:0; cursor:pointer; }
  input[type=checkbox] { width:18px; height:18px; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap">
  <div id="scoreRow"><span id="nL" class="pname"></span><span id="score">0 : 0</span><span id="nR" class="pname"></span></div>
  <div id="stats"></div>
  <canvas id="c" width="800" height="500"></canvas>
  <div id="msg"></div>
  <div id="bar"><button id="menuBtn" class="ghost">Menu</button></div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>PONG</h1>

    <div id="pseudoGroup">
      <div class="label">Ton pseudo</div>
      <input id="pseudo" class="txt" maxlength="20" placeholder="Ton pseudo" autocomplete="off">
    </div>

    <div id="twoPlayerGroup" style="display:none">
      <div class="label">Noms des joueurs (même écran)</div>
      <div class="row">
        <input id="p2L" class="txt" maxlength="20" placeholder="Joueur gauche" autocomplete="off">
        <input id="p2R" class="txt" maxlength="20" placeholder="Joueur droit" autocomplete="off">
      </div>
    </div>

    <div>
      <div class="label">Mode</div>
      <div class="row">
        <button class="opt on" data-mode="ai">Contre l'IA</button>
        <button class="opt" data-mode="2p">À deux (même écran)</button>
        <button class="opt" data-mode="online">En ligne (code)</button>
      </div>
    </div>

    <div id="diffGroup">
      <div class="label">Difficulté</div>
      <div class="row">
        <button class="opt" data-diff="easy">Facile</button>
        <button class="opt on" data-diff="medium">Moyen</button>
        <button class="opt" data-diff="hard">Difficile</button>
      </div>
    </div>

    <div id="onlineGroup" style="display:none">
      <div class="label">En ligne</div>
      <div class="row"><button id="hostBtn" class="opt">Créer une partie (je suis l'hôte)</button></div>
      <div class="row" style="margin-top:10px">
        <input id="codeIn" class="txt" maxlength="6" placeholder="CODE" autocomplete="off">
        <button id="joinBtn" class="opt">Rejoindre</button>
      </div>
    </div>

    <div id="netMsg" class="hint"></div>
    <div id="menuStats" class="hint"></div>
    <button id="resetStats" class="ghost">Réinitialiser les compteurs</button>
    <button id="play" class="primary">Jouer</button>

    <details>
      <summary>Personnaliser l'affichage</summary>
      <div class="custom">
        <label><input type="checkbox" id="ghibli"> Style Ghibli (ciel pastel et nuages)</label>
        <label>Thème
          <select id="theme" class="txt">
            <option value="nuit">Nuit</option>
            <option value="ocean">Océan</option>
            <option value="neon">Néon</option>
            <option value="clair">Clair</option>
          </select>
        </label>
        <label>Raquette gauche <input type="color" id="colL"></label>
        <label>Raquette droite <input type="color" id="colR"></label>
        <label>Balle <input type="color" id="colBall"></label>
        <button id="resetLook" class="ghost">Réinitialiser l'apparence</button>
      </div>
    </details>

    <div class="hint">Joueur gauche : W / S ou souris · Joueur droit : ↑ ↓ (mode à deux) · Espace : démarrer / pause · 7 points pour gagner</div>
  </div>
</div>

<script defer src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const W = 800, H = 500, PAD_H = 90, PAD_W = 12, BALL = 9, WIN = 7;
const DIFFS = {
  easy:   { aiSpeed: 2.6, err: 90 },
  medium: { aiSpeed: 4.2, err: 38 },
  hard:   { aiSpeed: 6.2, err: 8 }
};
const THEMES = {
  nuit:  { bg: '#0b0f1a', text: '#e6edf7', field: '#050810', line: '#24314d' },
  ocean: { bg: '#06202e', text: '#e0f7fa', field: '#0a3142', line: '#1d5870' },
  neon:  { bg: '#05000f', text: '#f0e6ff', field: '#0d0220', line: '#7b2cbf' },
  clair: { bg: '#eef2f8', text: '#1a2233', field: '#ffffff', line: '#b8c4d9' }
};
const GHIBLI_BG = { bg: '#dff0e4', text: '#2d3b2f', line: '#a9c9b0' };

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), msgEl = document.getElementById('msg');
const nLEl = document.getElementById('nL'), nREl = document.getElementById('nR');
const statsEl = document.getElementById('stats'), menuStatsEl = document.getElementById('menuStats');
const menuEl = document.getElementById('menu'), diffGroup = document.getElementById('diffGroup');
const onlineGroup = document.getElementById('onlineGroup'), netMsg = document.getElementById('netMsg');
const playBtn = document.getElementById('play'), codeIn = document.getElementById('codeIn');
const pseudoGroup = document.getElementById('pseudoGroup'), twoPlayerGroup = document.getElementById('twoPlayerGroup');
const pseudoIn = document.getElementById('pseudo'), p2L = document.getElementById('p2L'), p2R = document.getElementById('p2R');
const themeSel = document.getElementById('theme'), colLIn = document.getElementById('colL'),
      colRIn = document.getElementById('colR'), colBallIn = document.getElementById('colBall'),
      ghibliIn = document.getElementById('ghibli');

let mode = 'ai', diff = 'medium';
let L, R, ball, ls, rs, state = 'menu', mouseY = null, aiErr = 0, remoteY = 0;
let role = null, peer = null, conn = null, snap = null; // role : null | 'host' | 'guest'
let resultSaved = false;
let names = ['', ''];   // [gauche, droite] affichés sur ce poste
let oppName = '';      // pseudo de l'adversaire en ligne (côté hôte)
const keys = {};

/* ---------- Profil et apparence (stockés dans le navigateur de ce poste) ---------- */

const PROFILE_KEY = 'pong-profile-v1';
const DEFAULT_LOOK = { theme: 'nuit', colL: '#4da3ff', colR: '#ff6b8a', colBall: '#ffffff', ghibli: false };

function loadProfile() {
  try {
    const p = JSON.parse(localStorage.getItem(PROFILE_KEY));
    if (p && typeof p === 'object') return { name: '', ...DEFAULT_LOOK, ...p };
  } catch (e) {}
  return { name: '', ...DEFAULT_LOOK };
}
function saveProfile() {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch (e) {}
}
let profile = loadProfile();

function sanitize(s, fallback) {
  const t = (s || '').trim().slice(0, 20);
  return t || fallback;
}

function applyLook() {
  const t = profile.ghibli ? GHIBLI_BG : (THEMES[profile.theme] || THEMES.nuit);
  document.body.style.background = t.bg;
  document.body.style.color = t.text;
  cv.style.background = profile.ghibli ? '#dff0e4' : (THEMES[profile.theme] || THEMES.nuit).field;
  cv.style.borderColor = t.line;
  nLEl.style.color = profile.colL;
  nREl.style.color = profile.colR;
}

function syncLookInputs() {
  pseudoIn.value = profile.name;
  ghibliIn.checked = !!profile.ghibli;
  themeSel.value = profile.theme;
  colLIn.value = profile.colL;
  colRIn.value = profile.colR;
  colBallIn.value = profile.colBall;
}

/* ---------- Compteurs ---------- */

const STATS_KEY = 'pong-stats-v1';
const emptyStats = () => ({ ai: { w: 0, l: 0 }, online: { w: 0, l: 0 } });

function loadStats() {
  try {
    const s = JSON.parse(localStorage.getItem(STATS_KEY));
    return s && s.ai && s.online ? s : emptyStats();
  } catch (e) { return emptyStats(); }
}
function saveStats() {
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
}
let stats = loadStats();

function finishGame(won) {
  if (resultSaved) return;
  resultSaved = true;
  const k = mode === 'online' ? 'online' : 'ai';
  if (won) stats[k].w++; else stats[k].l++;
  saveStats();
  updateStatsLine();
}

function statsText() {
  if (mode === '2p') return 'Compteurs non disponibles en mode à deux sur un même écran.';
  const s = stats[mode === 'online' ? 'online' : 'ai'];
  const label = mode === 'online' ? 'En ligne' : "Contre l'IA";
  return label + ' — Victoires : ' + s.w + ' · Défaites : ' + s.l;
}

function updateStatsLine() {
  statsEl.textContent = mode === '2p' ? '' : statsText();
  menuStatsEl.textContent = statsText();
}

/* ---------- Noms ---------- */

function setNames(l, r) {
  names = [l, r];
  nLEl.textContent = l;
  nREl.textContent = r;
}

function computeNames() {
  if (mode === 'ai') return [sanitize(profile.name, 'Joueur'), 'IA'];
  if (mode === '2p') return [sanitize(p2L.value, 'Joueur gauche'), sanitize(p2R.value, 'Joueur droit')];
  return [sanitize(profile.name, 'Hôte'), oppName || 'Adversaire'];
}

/* ---------- Logique de jeu ---------- */

function helpText() {
  if (mode === 'online') return 'Espace ou clic pour démarrer (hôte) · Gauche : W / S ou souris';
  if (mode === '2p') return 'Espace ou clic pour démarrer · Gauche : W / S ou souris · Droite : ↑ ↓';
  return 'Espace ou clic pour démarrer · ↑ ↓ ou W / S, ou la souris, pour jouer';
}

function serve(dir) {
  const a = Math.random() * 0.6 - 0.3;
  ball = { x: W / 2, y: H / 2, vx: dir * 5 * Math.cos(a), vy: 5 * Math.sin(a), speed: 5 };
}

function updateScore() { scoreEl.textContent = ls + ' : ' + rs; }

function reset() {
  L = { x: 24, y: H / 2 - PAD_H / 2 };
  R = { x: W - 24 - PAD_W, y: H / 2 - PAD_H / 2 };
  remoteY = R.y;
  ls = 0; rs = 0; aiErr = 0;
  serve(1);
  updateScore();
}

function startGame() {
  reset();
  resultSaved = false;
  setNames(...computeNames());
  state = 'ready';
  menuEl.classList.add('hidden');
  msgEl.textContent = helpText();
  updateStatsLine();
}

function refreshMenu() {
  diffGroup.style.display = mode === 'ai' ? '' : 'none';
  onlineGroup.style.display = mode === 'online' ? '' : 'none';
  pseudoGroup.style.display = mode === '2p' ? 'none' : '';
  twoPlayerGroup.style.display = mode === '2p' ? '' : 'none';
  playBtn.style.display = mode === 'online' ? 'none' : '';
  updateStatsLine();
}

function showMenu() {
  destroyPeer();
  state = 'menu';
  menuEl.classList.remove('hidden');
  refreshMenu();
  msgEl.textContent = '';
}

function togglePlay() {
  if (state === 'menu') return;
  if (role === 'guest') { msgEl.textContent = "Seul l'hôte peut lancer ou mettre en pause la partie."; return; }
  if (state === 'over') { if (mode === 'online') showMenu(); else startGame(); return; }
  if (state === 'ready') { state = 'playing'; msgEl.textContent = 'Espace pour mettre en pause'; }
  else if (state === 'playing') { state = 'paused'; msgEl.textContent = 'Pause · Espace pour reprendre'; }
  else if (state === 'paused') { state = 'playing'; msgEl.textContent = 'Espace pour mettre en pause'; }
}

function bounce(p, dir) {
  const rel = (ball.y - (p.y + PAD_H / 2)) / (PAD_H / 2); // -1 .. 1
  ball.speed = Math.min(ball.speed + 0.35, 12);
  const ang = rel * 0.9;
  ball.vx = dir * ball.speed * Math.cos(ang);
  ball.vy = ball.speed * Math.sin(ang);
  ball.x = dir > 0 ? p.x + PAD_W + BALL : p.x - BALL;
}

function point(dir) {
  // dir = -1 : le joueur de gauche a manqué ; dir = 1 : le joueur de droite a manqué
  updateScore();
  if (ls >= WIN || rs >= WIN) {
    state = 'over';
    if (mode === 'ai' || (mode === 'online' && role === 'host')) finishGame(ls >= WIN);
    const winner = ls >= WIN ? names[0] : names[1];
    let txt;
    if (mode === 'ai') txt = ls >= WIN ? 'Bravo ' + winner + ', tu gagnes ! ' : "L'IA gagne cette fois. ";
    else txt = winner + ' gagne ! ';
    const suffix = mode === 'online' ? 'Espace pour revenir au menu.' : 'Espace pour rejouer · Menu pour changer les réglages.';
    msgEl.textContent = txt + suffix;
    return;
  }
  state = 'ready';
  serve(dir);
  msgEl.textContent = 'Espace ou clic pour servir';
}

function step() {
  // Raquette gauche : souris ou W / S
  if (mouseY !== null) {
    L.y += (mouseY - PAD_H / 2 - L.y) * 0.35;
  } else {
    L.y += ((keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0)) * 8;
  }
  L.y = Math.max(0, Math.min(H - PAD_H, L.y));

  // Raquette droite : flèches (2 joueurs), joueur distant (en ligne) ou IA
  if (mode === '2p') {
    R.y += ((keys['arrowdown'] ? 1 : 0) - (keys['arrowup'] ? 1 : 0)) * 8;
  } else if (mode === 'online') {
    R.y = remoteY;
  } else {
    const cfg = DIFFS[diff];
    const target = ball.y - PAD_H / 2 + aiErr;
    const d = target - R.y;
    R.y += Math.sign(d) * Math.min(Math.abs(d), cfg.aiSpeed);
  }
  R.y = Math.max(0, Math.min(H - PAD_H, R.y));

  // Balle
  ball.x += ball.vx;
  ball.y += ball.vy;
  if (ball.y < BALL) { ball.y = BALL; ball.vy = -ball.vy; }
  if (ball.y > H - BALL) { ball.y = H - BALL; ball.vy = -ball.vy; }

  // Collisions avec les raquettes
  if (ball.vx < 0 && ball.x - BALL <= L.x + PAD_W && ball.x - BALL >= L.x - 10 &&
      ball.y >= L.y && ball.y <= L.y + PAD_H) {
    bounce(L, 1);
  }
  if (ball.vx > 0 && ball.x + BALL >= R.x && ball.x + BALL <= R.x + PAD_W + 10 &&
      ball.y >= R.y && ball.y <= R.y + PAD_H) {
    bounce(R, -1);
    aiErr = (Math.random() * 2 - 1) * DIFFS[diff].err;
  }

  // Points
  if (ball.x < 0) { rs++; point(-1); }
  else if (ball.x > W) { ls++; point(1); }
}

/* ---------- Dessin ---------- */

function drawCloud(x, y, s) {
  ctx.beginPath();
  ctx.ellipse(x, y, 50 * s, 20 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 35 * s, y - 10 * s, 35 * s, 22 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x - 35 * s, y - 6 * s, 30 * s, 18 * s, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawGhibliBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#9fd8ef');
  g.addColorStop(0.6, '#e6f4e8');
  g.addColorStop(1, '#f7e7b4');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // soleil
  ctx.fillStyle = 'rgba(255,246,200,0.9)';
  ctx.beginPath(); ctx.arc(W - 110, 90, 46, 0, Math.PI * 2); ctx.fill();
  // nuages
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  drawCloud(150, 110, 1);
  drawCloud(470, 70, 0.8);
  drawCloud(640, 300, 1.1);
  // colline
  ctx.fillStyle = '#9ccf8a';
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.quadraticCurveTo(200, H - 70, 400, H - 30);
  ctx.quadraticCurveTo(600, H - 80, W, H - 40);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  const t = THEMES[profile.theme] || THEMES.nuit;
  if (profile.ghibli) drawGhibliBackground();
  else { ctx.fillStyle = t.field; ctx.fillRect(0, 0, W, H); }

  ctx.setLineDash([10, 12]);
  ctx.strokeStyle = profile.ghibli ? 'rgba(255,255,255,0.8)' : t.line;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = profile.colL;
  ctx.fillRect(L.x, L.y, PAD_W, PAD_H);
  ctx.fillStyle = profile.colR;
  ctx.fillRect(R.x, R.y, PAD_W, PAD_H);

  if (profile.ghibli) { ctx.shadowColor = profile.colBall; ctx.shadowBlur = 14; }
  ctx.fillStyle = profile.colBall;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
}

/* ---------- En ligne ---------- */

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function destroyPeer() {
  if (conn) { try { conn.close(); } catch (e) {} conn = null; }
  if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  role = null;
  snap = null;
  oppName = '';
}

function hostGame() {
  if (typeof Peer === 'undefined') { netMsg.textContent = 'Le multijoueur ne se charge pas (vérifie ta connexion).'; return; }
  destroyPeer();
  const code = genCode();
  role = 'host';
  peer = new Peer('pong-' + code.toLowerCase());
  netMsg.textContent = 'Code de connexion : ' + code + ' (usage unique). Donne-le à ton adversaire.';
  peer.on('connection', c => {
    if (conn) { c.close(); return; } // code déjà utilisé : refus
    conn = c;
    conn.on('data', d => {
      if (!d) return;
      if (d.t === 'p') remoteY = d.y;
      if (d.t === 'n') {
        oppName = sanitize(d.name, 'Adversaire');
        setNames(sanitize(profile.name, 'Hôte'), oppName);
      }
    });
    conn.on('close', () => {
      conn = null;
      oppName = '';
      if (state !== 'over' && state !== 'menu') { state = 'paused'; msgEl.textContent = 'Adversaire déconnecté. Espace pour reprendre.'; }
    });
    oppName = '';
    startGame();
    msgEl.textContent = 'Adversaire connecté ! ' + helpText();
  });
  peer.on('error', e => { netMsg.textContent = 'Erreur réseau : ' + e.type; });
}

function joinGame(code) {
  if (typeof Peer === 'undefined') { netMsg.textContent = 'Le multijoueur ne se charge pas (vérifie ta connexion).'; return; }
  destroyPeer();
  role = 'guest';
  netMsg.textContent = 'Connexion en cours…';
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect('pong-' + code.toLowerCase(), { reliable: true });
    conn.on('open', () => {
      state = 'guest';
      resultSaved = false;
      menuEl.classList.add('hidden');
      setNames('…', sanitize(profile.name, 'Joueur'));
      conn.send({ t: 'n', name: sanitize(profile.name, 'Joueur') });
      msgEl.textContent = "Connecté à l'hôte. En attente du lancement de la partie.";
      updateStatsLine();
    });
    conn.on('data', d => { if (d && d.t === 's') snap = d; });
    conn.on('close', () => { msgEl.textContent = 'Connexion perdue ou partie terminée.'; });
  });
  peer.on('error', e => {
    netMsg.textContent = e.type === 'peer-unavailable' ? 'Code invalide ou déjà utilisé.' : 'Erreur réseau : ' + e.type;
    if (e.type === 'peer-unavailable') destroyPeer();
  });
}

function sendSnapshot() {
  if (role !== 'host' || !conn || !conn.open) return;
  conn.send({
    t: 's', b: [ball.x, ball.y], L: L.y, R: R.y, sc: [ls, rs],
    nm: names, m: msgEl.textContent, st: state
  });
}

function guestFrame() {
  if (!conn || !conn.open) return;
  // Raquette du joueur distant (droite), envoyée à l'hôte
  if (mouseY !== null) R.y += (mouseY - PAD_H / 2 - R.y) * 0.35;
  else R.y += ((keys['arrowdown'] ? 1 : 0) - (keys['arrowup'] ? 1 : 0)) * 8;
  R.y = Math.max(0, Math.min(H - PAD_H, R.y));
  conn.send({ t: 'p', y: R.y });
  // Affiche l'état reçu de l'hôte
  if (snap) {
    ball.x = snap.b[0]; ball.y = snap.b[1];
    L.y = snap.L;
    ls = snap.sc[0]; rs = snap.sc[1];
    updateScore();
    if (snap.nm && (names[0] !== snap.nm[0] || names[1] !== snap.nm[1])) setNames(snap.nm[0], snap.nm[1]);
    if (snap.m && msgEl.textContent !== snap.m) msgEl.textContent = snap.m;
    // Compteur du joueur invité, enregistré sur son propre poste
    if (snap.st === 'over') finishGame(rs >= WIN);
  }
}

function loop() {
  if (role === 'guest') guestFrame();
  else if (role === 'host') { if (state === 'playing') step(); sendSnapshot(); }
  else if (state === 'playing') step();
  draw();
  requestAnimationFrame(loop);
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong contre l'IA</title>
<style>
  html, body { margin:0; height:100%; background:#0b0f1a; color:#e6edf7; font-family: system-ui, -apple-system, sans-serif; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; padding:10px; box-sizing:border-box; }
  #score { font-size:2.2rem; font-variant-numeric: tabular-nums; letter-spacing:.2em; }
  canvas { background:#050810; border:2px solid #24314d; border-radius:10px; width:min(100%,800px); max-height:75vh; aspect-ratio:800/500; touch-action:none; cursor:none; }
  #msg { font-size:.95rem; opacity:.85; min-height:1.3em; text-align:center; }
  button { background:#2b6cff; color:#fff; border:0; border-radius:8px; padding:8px 16px; font-size:1rem; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap">
  <div id="score">0 : 0</div>
  <canvas id="c" width="800" height="500"></canvas>
  <div id="msg"></div>
  <button id="btn">Nouvelle partie</button>
</div>
<script>
const W = 800, H = 500, PAD_H = 90, PAD_W = 12, BALL = 9, WIN = 7;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), msgEl = document.getElementById('msg');
const HELP = 'Espace ou clic pour démarrer · ↑ ↓ ou W / S, ou la souris, pour jouer';

let player, ai, ball, ps, as, state, mouseY = null, aiErr = 0;
const keys = {};

function serve(dir) {
  const a = Math.random() * 0.6 - 0.3;
  ball = { x: W / 2, y: H / 2, vx: dir * 5 * Math.cos(a), vy: 5 * Math.sin(a), speed: 5 };
}

function updateScore() { scoreEl.textContent = ps + ' : ' + as; }

function reset() {
  player = { x: 24, y: H / 2 - PAD_H / 2 };
  ai = { x: W - 24 - PAD_W, y: H / 2 - PAD_H / 2 };
  ps = 0; as = 0; aiErr = 0;
  state = 'ready';
  serve(1);
  updateScore();
  msgEl.textContent = HELP;
}

function bounce(p, dir) {
  const rel = (ball.y - (p.y + PAD_H / 2)) / (PAD_H / 2); // -1 .. 1
  ball.speed = Math.min(ball.speed + 0.35, 12);
  const ang = rel * 0.9;
  ball.vx = dir * ball.speed * Math.cos(ang);
  ball.vy = ball.speed * Math.sin(ang);
  ball.x = dir > 0 ? p.x + PAD_W + BALL : p.x - BALL;
}

function point(dir) {
  // dir = -1 : le joueur (à gauche) a manqué ; dir = 1 : l'IA a manqué
  updateScore();
  if (ps >= WIN || as >= WIN) {
    state = 'over';
    msgEl.textContent = (ps >= WIN ? 'Bravo, tu gagnes ! ' : "L'IA gagne cette fois. ") + 'Espace ou « Nouvelle partie » pour rejouer.';
    return;
  }
  state = 'ready';
  serve(dir);
  msgEl.textContent = 'Espace ou clic pour servir';
}

function step() {
  // Raquette du joueur : clavier ou souris/tactile
  const up = keys['arrowup'] || keys['w'];
  const dn = keys['arrowdown'] || keys['s'];
  if (mouseY !== null) {
    player.y += (mouseY - PAD_H / 2 - player.y) * 0.35;
  } else {
    player.y += ((dn ? 1 : 0) - (up ? 1 : 0)) * 8;
  }
  player.y = Math.max(0, Math.min(H - PAD_H, player.y));

  // IA : suit la balle avec une erreur variable et une vitesse limitée
  const target = ball.y - PAD_H / 2 + aiErr;
  const diff = target - ai.y;
  ai.y += Math.sign(diff) * Math.min(Math.abs(diff), 4.2);
  ai.y = Math.max(0, Math.min(H - PAD_H, ai.y));

  // Balle
  ball.x += ball.vx;
  ball.y += ball.vy;
  if (ball.y < BALL) { ball.y = BALL; ball.vy = -ball.vy; }
  if (ball.y > H - BALL) { ball.y = H - BALL; ball.vy = -ball.vy; }

  // Collisions avec les raquettes
  if (ball.vx < 0 && ball.x - BALL <= player.x + PAD_W && ball.x - BALL >= player.x - 10 &&
      ball.y >= player.y && ball.y <= player.y + PAD_H) {
    bounce(player, 1);
  }
  if (ball.vx > 0 && ball.x + BALL >= ai.x && ball.x + BALL <= ai.x + PAD_W + 10 &&
      ball.y >= ai.y && ball.y <= ai.y + PAD_H) {
    bounce(ai, -1);
    aiErr = (Math.random() * 2 - 1) * 38; // nouvelle imprécision à chaque renvoi
  }

  // Points
  if (ball.x < 0) { as++; point(-1); }
  else if (ball.x > W) { ps++; point(1); }
}

function draw() {
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);
  ctx.setLineDash([10, 12]);
  ctx.strokeStyle = '#24314d';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#4da3ff';
  ctx.fillRect(player.x, player.y, PAD_W, PAD_H);
  ctx.fillStyle = '#ff6b8a';
  ctx.fillRect(ai.x, ai.y, PAD_W, PAD_H);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL, 0, Math.PI * 2); ctx.fill();
}

function loop() {
  if (state === 'playing') step();
  draw();
  requestAnimationFrame(loop);
}

function start() {
  if (state === 'over') reset();
  if (state === 'playing') { state = 'paused'; msgEl.textContent = 'Pause · Espace pour reprendre'; }
  else { state = 'playing'; msgEl.textContent = 'Espace pour mettre en pause'; }
}

// Clavier
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', ' ', 'w', 's'].includes(k)) e.preventDefault();
  if (k === ' ') { start(); return; }
  keys[k] = true;
});
document.addEventListener('keyup', e => { delete keys[e.key.toLowerCase()]; });

// Souris
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouseY = (e.clientY - r.top) * (H / r.height);
});
cv.addEventListener('mouseleave', () => { mouseY = null; });
cv.addEventListener('click', start);

// Tactile
function touchY(e) {
  const r = cv.getBoundingClientRect();
  const t = e.touches[0];
  mouseY = (t.clientY - r.top) * (H / r.height);
}
cv.addEventListener('touchstart', e => { e.preventDefault(); touchY(e); start(); }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); touchY(e); }, { passive: false });
cv.addEventListener('touchend', () => { mouseY = null; });

document.getElementById('btn').addEventListener('click', () => { reset(); start(); });

reset();
loop();
</script>
</body>
</html>

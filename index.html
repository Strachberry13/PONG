<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong</title>
<style>
  html, body { margin:0; height:100%; background:#0b0f1a; color:#e6edf7; font-family: system-ui, -apple-system, sans-serif; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; padding:10px; box-sizing:border-box; }
  #score { font-size:2.2rem; font-variant-numeric: tabular-nums; letter-spacing:.2em; }
  canvas { background:#050810; border:2px solid #24314d; border-radius:10px; width:min(100%,800px); max-height:70vh; aspect-ratio:800/500; touch-action:none; cursor:none; }
  #msg { font-size:.95rem; opacity:.85; min-height:1.3em; text-align:center; }
  button { background:#2b6cff; color:#fff; border:0; border-radius:8px; padding:8px 16px; font-size:1rem; cursor:pointer; }
  button.ghost { background:#1a2540; color:#c9d6ef; border:1px solid #24314d; }
  .overlay { position:fixed; inset:0; background:rgba(5,8,16,.88); display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  .overlay.hidden { display:none; }
  .card { background:#101829; border:1px solid #24314d; border-radius:14px; padding:24px 28px; width:min(420px,100%); display:flex; flex-direction:column; gap:18px; box-sizing:border-box; }
  .card h1 { margin:0; text-align:center; font-size:2rem; letter-spacing:.15em; }
  .label { font-size:.85rem; text-transform:uppercase; letter-spacing:.1em; opacity:.7; margin-bottom:6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .opt { flex:1; background:#1a2540; color:#c9d6ef; border:1px solid #24314d; }
  .opt.on { background:#2b6cff; color:#fff; border-color:#2b6cff; }
  .primary { font-size:1.1rem; padding:12px; }
  .hint { font-size:.8rem; opacity:.6; text-align:center; line-height:1.5; }
  #bar { display:flex; gap:8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="score">0 : 0</div>
  <canvas id="c" width="800" height="500"></canvas>
  <div id="msg"></div>
  <div id="bar"><button id="menuBtn" class="ghost">Menu</button></div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>PONG</h1>
    <div>
      <div class="label">Mode</div>
      <div class="row">
        <button class="opt on" data-mode="ai">Contre l'IA</button>
        <button class="opt" data-mode="2p">À deux joueurs</button>
      </div>
    </div>
    <div id="diffGroup">
      <div class="label">Difficulté</div>
      <div class="row">
        <button class="opt" data-diff="easy">Facile</button>
        <button class="opt on" data-diff="medium">Moyen</button>
        <button class="opt" data-diff="hard">Difficile</button>
      </div>
    </div>
    <button id="play" class="primary">Jouer</button>
    <div class="hint">Joueur gauche : W / S ou souris<br>Joueur droit (mode à deux) : ↑ ↓<br>Espace : démarrer / pause · première équipe à 7 points</div>
  </div>
</div>

<script>
const W = 800, H = 500, PAD_H = 90, PAD_W = 12, BALL = 9, WIN = 7;
const DIFFS = {
  easy:   { aiSpeed: 2.6, err: 90 },
  medium: { aiSpeed: 4.2, err: 38 },
  hard:   { aiSpeed: 6.2, err: 8 }
};

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), msgEl = document.getElementById('msg');
const menuEl = document.getElementById('menu'), diffGroup = document.getElementById('diffGroup');

let mode = 'ai', diff = 'medium';
let L, R, ball, ls, rs, state = 'menu', mouseY = null, aiErr = 0;
const keys = {};

function helpText() {
  return mode === '2p'
    ? 'Espace ou clic pour démarrer · Gauche : W / S ou souris · Droite : ↑ ↓'
    : 'Espace ou clic pour démarrer · ↑ ↓ ou W / S, ou la souris, pour jouer';
}

function serve(dir) {
  const a = Math.random() * 0.6 - 0.3;
  ball = { x: W / 2, y: H / 2, vx: dir * 5 * Math.cos(a), vy: 5 * Math.sin(a), speed: 5 };
}

function updateScore() { scoreEl.textContent = ls + ' : ' + rs; }

function reset() {
  L = { x: 24, y: H / 2 - PAD_H / 2 };
  R = { x: W - 24 - PAD_W, y: H / 2 - PAD_H / 2 };
  ls = 0; rs = 0; aiErr = 0;
  serve(1);
  updateScore();
}

function startGame() {
  reset();
  state = 'ready';
  menuEl.classList.add('hidden');
  msgEl.textContent = helpText();
}

function showMenu() {
  state = 'menu';
  menuEl.classList.remove('hidden');
  diffGroup.style.display = mode === 'ai' ? '' : 'none';
  msgEl.textContent = '';
}

function togglePlay() {
  if (state === 'menu') return;
  if (state === 'over') { startGame(); return; }
  if (state === 'ready') { state = 'playing'; msgEl.textContent = 'Espace pour mettre en pause'; }
  else if (state === 'playing') { state = 'paused'; msgEl.textContent = 'Pause · Espace pour reprendre'; }
  else if (state === 'paused') { state = 'playing'; msgEl.textContent = 'Espace pour mettre en pause'; }
}

function bounce(p, dir) {
  const rel = (ball.y - (p.y + PAD_H / 2)) / (PAD_H / 2); // -1 .. 1
  ball.speed = Math.min(ball.speed + 0.35, 12);
  const ang = rel * 0.9;
  ball.vx = dir * ball.speed * Math.cos(ang);
  ball.vy = ball.speed * Math.sin(ang);
  ball.x = dir > 0 ? p.x + PAD_W + BALL : p.x - BALL;
}

function point(dir) {
  // dir = -1 : le joueur de gauche a manqué ; dir = 1 : le joueur de droite a manqué
  updateScore();
  if (ls >= WIN || rs >= WIN) {
    state = 'over';
    let txt;
    if (mode === '2p') txt = (ls >= WIN ? 'Joueur gauche gagne ! ' : 'Joueur droit gagne ! ');
    else txt = (ls >= WIN ? 'Bravo, tu gagnes ! ' : "L'IA gagne cette fois. ");
    msgEl.textContent = txt + 'Espace pour rejouer · Menu pour changer les réglages.';
    return;
  }
  state = 'ready';
  serve(dir);
  msgEl.textContent = 'Espace ou clic pour servir';
}

function step() {
  // Raquette gauche : souris ou W / S
  if (mouseY !== null) {
    L.y += (mouseY - PAD_H / 2 - L.y) * 0.35;
  } else {
    L.y += ((keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0)) * 8;
  }
  L.y = Math.max(0, Math.min(H - PAD_H, L.y));

  // Raquette droite : deuxième joueur (flèches) ou IA
  if (mode === '2p') {
    R.y += ((keys['arrowdown'] ? 1 : 0) - (keys['arrowup'] ? 1 : 0)) * 8;
  } else {
    const cfg = DIFFS[diff];
    const target = ball.y - PAD_H / 2 + aiErr;
    const d = target - R.y;
    R.y += Math.sign(d) * Math.min(Math.abs(d), cfg.aiSpeed);
  }
  R.y = Math.max(0, Math.min(H - PAD_H, R.y));

  // Balle
  ball.x += ball.vx;
  ball.y += ball.vy;
  if (ball.y < BALL) { ball.y = BALL; ball.vy = -ball.vy; }
  if (ball.y > H - BALL) { ball.y = H - BALL; ball.vy = -ball.vy; }

  // Collisions avec les raquettes
  if (ball.vx < 0 && ball.x - BALL <= L.x + PAD_W && ball.x - BALL >= L.x - 10 &&
      ball.y >= L.y && ball.y <= L.y + PAD_H) {
    bounce(L, 1);
  }
  if (ball.vx > 0 && ball.x + BALL >= R.x && ball.x + BALL <= R.x + PAD_W + 10 &&
      ball.y >= R.y && ball.y <= R.y + PAD_H) {
    bounce(R, -1);
    aiErr = (Math.random() * 2 - 1) * DIFFS[diff].err; // imprécision de l'IA, selon la difficulté
  }

  // Points
  if (ball.x < 0) { rs++; point(-1); }
  else if (ball.x > W) { ls++; point(1); }
}

function draw() {
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);
  ctx.setLineDash([10, 12]);
  ctx.strokeStyle = '#24314d';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#4da3ff';
  ctx.fillRect(L.x, L.y, PAD_W, PAD_H);
  ctx.fillStyle = '#ff6b8a';
  ctx.fillRect(R.x, R.y, PAD_W, PAD_H);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL, 0, Math.PI * 2); ctx.fill();
}

function loop() {
  if (state === 'playing') step();
  draw();
  requestAnimationFrame(loop);
}

// Clavier
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', ' ', 'w', 's'].includes(k)) e.preventDefault();
  if (state === 'menu') return;
  if (k === ' ') { togglePlay(); return; }
  keys[k] = true;
});
document.addEventListener('keyup', e => { delete keys[e.key.toLowerCase()]; });

// Souris
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouseY = (e.clientY - r.top) * (H / r.height);
});
cv.addEventListener('mouseleave', () => { mouseY = null; });
cv.addEventListener('click', togglePlay);

// Tactile
function touchY(e) {
  const r = cv.getBoundingClientRect();
  mouseY = (e.touches[0].clientY - r.top) * (H / r.height);
}
cv.addEventListener('touchstart', e => { e.preventDefault(); touchY(e); togglePlay(); }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); touchY(e); }, { passive: false });
cv.addEventListener('touchend', () => { mouseY = null; });

// Menu
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
  diffGroup.style.display = mode === 'ai' ? '' : 'none';
}));
document.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => {
  diff = b.dataset.diff;
  document.querySelectorAll('[data-diff]').forEach(x => x.classList.toggle('on', x === b));
}));
document.getElementById('play').addEventListener('click', startGame);
document.getElementById('menuBtn').addEventListener('click', showMenu);

reset();
showMenu();
loop();
</script>
</body>
</html>
